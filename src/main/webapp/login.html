<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>PocketChef | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                    "Segoe UI",
                    Arial,
                    sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                    linear-gradient(
                            135deg,
                            #fff7f2,
                            #ffffff,
                            #fff0ea
                    );

            color: #263238;
        }

        .login-container {
            width: 410px;
            max-width: 90%;

            background: rgba(255,255,255,0.96);

            padding: 42px 38px;

            border-radius: 25px;

            box-shadow:
                    0 20px 50px
                    rgba(38,50,56,0.12);

            text-align: center;
        }

        .logo-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            background:
                    linear-gradient(
                            135deg,
                            #ff7043,
                            #ff9a76
                    );

            box-shadow:
                    0 10px 25px
                    rgba(255,112,67,0.25);
        }

        h1 {
            color: #ff7043;

            font-size: 30px;

            margin-bottom: 7px;
        }

        .subtitle {
            color: #7a7f87;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;

            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

            color: #37474f;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #e0e0e0;

            border-radius: 11px;

            font-size: 14px;

            outline: none;

            transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
        }

        input:focus {
            border-color: #ff7043;

            box-shadow:
                    0 0 0 3px
                    rgba(255,112,67,0.10);
        }

        button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 11px;

            background:
                    linear-gradient(
                            135deg,
                            #ff7043,
                            #ff5a36
                    );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            box-shadow:
                    0 8px 18px
                    rgba(255,112,67,0.22);

            transition:
                    transform 0.2s,
                    box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 12px 25px
                    rgba(255,112,67,0.28);
        }

        .register-text {
            margin-top: 24px;

            font-size: 14px;

            color: #777;
        }

        .register-text a {
            color: #ff7043;

            font-weight: 700;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        @media(max-width:500px) {

            .login-container {
                padding: 35px 25px;
            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo-icon">
        🍳
    </div>

    <h1>PocketChef</h1>

    <p class="subtitle">
        Your smart recipe companion
    </p>


    <form action="login"
          method="post">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register-text">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>

</body>

</html>
